services:
  - type: web
    name: golubka-avia
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: golubka-avia-db
          property: connectionString
      - key: SECURE_COOKIE
        value: "1"

databases:
  - name: golubka-avia-db
    plan: free
    region: frankfurt
    ipAllowList: []
